[project]
name = "comfyui-kraken-tools"
version = "1.0.0"
description = "A collection of productivity custom nodes for ComfyUI - prompt builders, model loaders, image processing, WAN video helpers, and more."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "The Kraken", email = "krakenunbound@example.com"}
]
keywords = ["comfyui", "custom-nodes", "image-generation", "prompt-builder", "lora", "wan-video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
    "numpy>=1.23.0",
    "opencv-python>=4.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]

[project.urls]
Homepage = "https://github.com/krakenunbound/comfyui-kraken-tools"
Repository = "https://github.com/krakenunbound/comfyui-kraken-tools"
Issues = "https://github.com/krakenunbound/comfyui-kraken-tools/issues"

[tool.setuptools]
packages = ["kraken_tools"]
